<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">钟楼说书人副驾驶 GitHub banner</title>
  <desc id="desc">Pad-first storyteller companion banner with abstract night order rings, dashboard cards, voting logs and AI draft hints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050910"/>
      <stop offset="0.48" stop-color="#0b121b"/>
      <stop offset="1" stop-color="#111821"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="34%" cy="45%" r="58%">
      <stop offset="0" stop-color="#e3b45a" stop-opacity="0.38"/>
      <stop offset="0.42" stop-color="#bf8a32" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050910" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="78%" cy="42%" r="48%">
      <stop offset="0" stop-color="#6ed8f4" stop-opacity="0.23"/>
      <stop offset="0.46" stop-color="#23556a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212c"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="0.46" stop-color="#e3b45a"/>
      <stop offset="1" stop-color="#9f6b23"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="42" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="42" fill="url(#grid)"/>
  <rect width="1600" height="620" rx="42" fill="url(#goldGlow)"/>
  <rect width="1600" height="620" rx="42" fill="url(#blueGlow)"/>

  <g opacity="0.55">
    <circle cx="1038" cy="292" r="214" fill="none" stroke="#e3b45a" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="1038" cy="292" r="164" fill="none" stroke="#6ed8f4" stroke-opacity="0.11" stroke-width="2"/>
    <circle cx="1038" cy="292" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
    <path d="M824 292h428" stroke="#e3b45a" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
    <path d="M1038 78v428" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="78" width="744" height="464" rx="32" fill="#0b1118" fill-opacity="0.78" stroke="#e3b45a" stroke-opacity="0.25"/>
    <rect x="112" y="106" width="688" height="118" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="146" y="155" fill="#e3b45a" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5">BOTC STORYTELLER COMPANION</text>
    <text x="146" y="202" fill="#f7efe2" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="52" font-weight="900">钟楼说书人副驾驶</text>

    <text x="118" y="286" fill="#dbe7f1" font-family="Inter, Segoe UI, sans-serif" font-size="29" font-weight="750">智能配板 · 夜序辅助 · 投票日志 · AI 草稿 · 复盘归档</text>
    <text x="118" y="334" fill="#94a8ba" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="600">Pad-first assistant for in-person Blood on the Clocktower storytellers.</text>
    <text x="118" y="374" fill="#94a8ba" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="600">AI suggests. Storyteller confirms. Official / physical grimoire remains the table view.</text>

    <g font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="800">
      <rect x="118" y="422" width="142" height="54" rx="18" fill="#1a2632" stroke="#e3b45a" stroke-opacity="0.42"/>
      <text x="148" y="457" fill="#ffe6a3">7-15 人</text>
      <rect x="278" y="422" width="170" height="54" rx="18" fill="#17272d" stroke="#6ed8f4" stroke-opacity="0.32"/>
      <text x="307" y="457" fill="#b9edff">夜间顺序</text>
      <rect x="466" y="422" width="152" height="54" rx="18" fill="#231c13" stroke="#e3b45a" stroke-opacity="0.32"/>
      <text x="494" y="457" fill="#ffe6a3">日志追溯</text>
      <rect x="636" y="422" width="146" height="54" rx="18" fill="#142421" stroke="#7ee0a1" stroke-opacity="0.32"/>
      <text x="666" y="457" fill="#c2f7d0">MIT Code</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="896" y="132" width="238" height="320" rx="30" fill="#101923" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="1015" cy="214" r="66" fill="#f4ead9" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="1015" cy="214" r="24" fill="#17212c" opacity="0.75"/>
    <text x="1015" y="318" text-anchor="middle" fill="#f7efe2" font-family="Noto Serif SC, Source Han Serif SC, serif" font-size="34" font-weight="900">夜序辅助</text>
    <text x="1015" y="354" text-anchor="middle" fill="#8fa2b5" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="700">逐个唤醒 · 逐项确认</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, sans-serif">
    <rect x="1188" y="128" width="300" height="78" rx="22" fill="#121d27" stroke="#6ed8f4" stroke-opacity="0.18"/>
    <text x="1218" y="160" fill="#7ee0a1" font-size="17" font-weight="800">CURRENT PHASE</text>
    <text x="1218" y="190" fill="#f7efe2" font-size="30" font-weight="900">第 3 夜</text>

    <rect x="1188" y="228" width="300" height="78" rx="22" fill="#121d27" stroke="#e3b45a" stroke-opacity="0.18"/>
    <text x="1218" y="260" fill="#e3b45a" font-size="17" font-weight="800">VOTE ROUND</text>
    <text x="1218" y="290" fill="#f7efe2" font-size="30" font-weight="900">1 号提名 4 号</text>

    <rect x="1188" y="328" width="300" height="108" rx="22" fill="#121d27" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="1218" y="360" fill="#9fb2c4" font-size="17" font-weight="800">AI DRAFT ONLY</text>
    <text x="1218" y="392" fill="#f7efe2" font-size="26" font-weight="900">建议采用前核对</text>
    <text x="1218" y="420" fill="#8fa2b5" font-size="17" font-weight="700">不自动改状态 · 不判胜负</text>
  </g>

  <rect x="1.5" y="1.5" width="1597" height="617" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
</svg>
